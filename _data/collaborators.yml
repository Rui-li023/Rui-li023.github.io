# Collaborators shown at the bottom of the homepage.
#
# Cards show: photo (or initials) + name + school.
# Fields, all optional except `name`:
#   affiliation - the school; left blank when it could not be confirmed
#   url         - homepage; without it the card is plain text, not a link
#   photo       - "images/collaborators/foo.jpg"; without it, initials
#   role        - supported by the template but deliberately unused here
#
# Schools come from the author affiliations printed in the papers themselves
# (arXiv 2505.22634 / 2605.02288 / 2604.05484 / 2412.10834), or from the
# person's own homepage. Photos are taken from each person's own homepage.
#
# Editing this file does NOT require restarting `jekyll serve`.

